name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libx11-dev libxi-dev libxtst-dev libxdo-dev

      - name: Strip build paths from binaries
        shell: bash
        run: |
          # Rust bakes dependency source paths into panic messages, and
          # `strip` does not remove them, so a binary would otherwise ship the
          # builder's home directory. Expanded here by the shell so no absolute
          # path is ever committed. (Cargo's own `trim-paths` is still nightly.)
          echo "RUSTFLAGS=--remap-path-prefix=$HOME=/build --remap-path-prefix=$PWD=/src" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm install

      - name: Build (and release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Cooper {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}
