[package]
name = "cooper"
version = "0.3.5"
description = "Cooper — a FOSS capture panel for AI-assisted work"
authors = ["Cooper contributors"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
window-vibrancy = "0.6"
base64 = "0.22"
# Only used to decode stored images back to RGBA for clipboard copy-out; display
# uses data: URLs the webview decodes itself, so this needs just the common
# formats. (gif's required dep version is absent from the registry, so it's out.)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
enigo = "0.2"

# rdev drives the raw keyboard listener (double-shift capture) everywhere except
# macOS, where it crashes (SIGTRAP in HIToolbox) decoding characters off-thread.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"

# macOS runs its own listen-only CGEventTap instead (see src/mac_tap.rs). Both
# crates are already in the tree via tauri/window-vibrancy, so this adds no build.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
libc = "0.2"

[profile.release]
panic = "abort"
lto = "thin"
opt-level = "s"
strip = true
